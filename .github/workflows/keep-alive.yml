# Keeps the free-tier Supabase project from auto-pausing by generating
# a small amount of daily traffic through the live site (SSR pages
# query Supabase on every render).
name: Keep database active

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live site (SSR pages read from Supabase)
        run: |
          for path in "" /events /traders /apply; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://paisley-christmas-markets.vercel.app${path}")
            echo "${path:-/} -> ${code}"
          done
